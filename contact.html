<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiceWorld | Contact</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
    <a href="index.html" class="logo">Rice<span>World</span></a>

    <button class="menu-btn" id="menuBtn">☰</button>

    <nav id="navMenu">
        <a href="index.html">Home</a>
        <a href="rice.html">Products</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="active">Contact</a>
    </nav>
</header>

<main>

<section class="page-header">
    <p>CONTACT US</p>
    <h1>Let's Talk</h1>
    <span>Have a question? Get in touch with us.</span>
</section>

<section class="contact-section">

    <div class="contact-info">

        <div class="contact-card">
            <div>📞</div>
            <div>
                <h3>Call Us</h3>
                <p>+91 98765 43210</p>
            </div>
        </div>

        <div class="contact-card">
            <div>✉️</div>
            <div>
                <h3>Email</h3>
                <p>hello@riceworld.com</p>
            </div>
        </div>

        <div class="contact-card">
            <div>📍</div>
            <div>
                <h3>Address</h3>
                <p>India</p>
            </div>
        </div>

    </div>

    <form id="contactForm" class="contact-form">

        <h2>Send a Message</h2>

        <input
            type="text"
            id="name"
            placeholder="Your Name"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Your Email"
            required
        >

        <textarea
            id="message"
            placeholder="Your Message"
            required
        ></textarea>

        <button class="btn primary" type="submit">
            Send Message
        </button>

    </form>

</section>

</main>

<footer>
    <p>© 2026 RiceWorld. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
