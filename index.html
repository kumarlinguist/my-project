<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tilt: videos, shorts and posts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F6FB; --surface:#FFFFFF; --surface2:#ECEAF6; --ink:#16142B; --muted:#65628A; --line:#DDDAEE;
  --accent:#3B45F5; --accent-ink:#FFFFFF; --sun:#FFC533; --sun-ink:#2A2100; --danger:#C72A63;
  --top:60px; --tab:0px;
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F0E1F; --surface:#1A1833; --surface2:#26234A; --ink:#F1F0FB; --muted:#A5A2C9; --line:#2F2C55;
    --accent:#8790FF; --accent-ink:#0F0E1F; --danger:#FF7AA5;
  }
}
:root[data-theme="dark"]{
  --bg:#0F0E1F; --surface:#1A1833; --surface2:#26234A; --ink:#F1F0FB; --muted:#A5A2C9; --line:#2F2C55;
  --accent:#8790FF; --accent-ink:#0F0E1F; --danger:#FF7AA5;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);min-height:100dvh}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em;line-height:1.15}

/* top bar */
.top{position:sticky;top:0;z-index:20;height:var(--top);display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font:800 24px var(--display);letter-spacing:-.03em}
.brand .mk{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;transform:rotate(-8deg)}
.brand .mk svg{width:14px;height:14px;fill:var(--accent-ink);transform:rotate(8deg)}
.search{flex:1;max-width:560px;margin:0 auto;display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 6px 0 16px}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;height:40px}
.search:focus-within{border-color:var(--accent)}
.icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.icon:hover{background:var(--surface2)}
.icon.sm{width:32px;height:32px}
.icon.sm svg.i{width:18px;height:18px}
.topr{display:flex;align-items:center;gap:10px;margin-left:auto}
.search + .topr{margin-left:0}

.av{--h:250;width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 15px var(--display);color:#fff;background:linear-gradient(135deg,hsl(var(--h) 70% 48%),hsl(calc(var(--h) + 40) 75% 38%))}
.av.lg{width:52px;height:52px;font-size:20px}
.av.xl{width:92px;height:92px;font-size:36px;border:4px solid var(--bg)}
.av.sm{width:28px;height:28px;font-size:12px}
#avBtn{border-radius:50%;padding:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;font-weight:600;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary,.btn.sub{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover,.btn.sub:hover{filter:brightness(1.08)}
.btn.sub.on{background:var(--surface2);color:var(--muted);border-color:var(--line)}
.btn.ghost{background:transparent}
.btn.sm{height:32px;padding:0 14px;font-size:14px}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* shell */
.shell{display:flex;align-items:flex-start}
.side{position:sticky;top:var(--top);width:236px;flex:none;height:calc(100dvh - var(--top));overflow:auto;padding:14px 12px;border-right:1px solid var(--line)}
.side h4{font:600 13px var(--body);color:var(--muted);margin:18px 14px 6px}
.nv{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:12px;font-weight:500}
.nv:hover{background:var(--surface2)}
.nv.on{background:var(--sun);color:var(--sun-ink);font-weight:600}
main{flex:1;min-width:0;padding:20px 26px 48px}
main.shorts-main{padding:0}
.tabbar{display:none}

/* chips */
.chips{display:flex;gap:8px;overflow:auto;padding-bottom:14px;scrollbar-width:none}
.chip{padding:7px 16px;border-radius:999px;background:var(--surface2);font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg)}

/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:22px 18px}
.thumb{position:relative;display:block;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--surface2)}
.thumb canvas,.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:8px;top:8px;background:var(--sun);color:var(--sun-ink);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(12,10,32,.8);color:#fff;border-radius:6px;padding:1px 7px;font-size:12px}
.vmeta{display:flex;gap:12px;margin-top:10px;align-items:flex-start}
.vmeta>div{flex:1;min-width:0}
.vt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600;line-height:1.3}
.vch{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.vch:hover{color:var(--ink)}
.vs{display:flex;gap:12px;color:var(--muted);font-size:13px}
.feat{grid-column:span 2;position:relative;border-radius:22px;overflow:hidden;min-height:300px;display:block;background:#111}
.feat canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feat .fs{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,8,30,.82),rgba(10,8,30,0) 62%)}
.feat .ft{position:absolute;left:24px;right:24px;bottom:22px;color:#fff}
.feat h2{font-size:clamp(1.5rem,3.2vw,2.5rem);max-width:20ch;font-weight:800}
.feat p{margin:6px 0 14px;opacity:.85}
.feat .btn{background:var(--sun);color:var(--sun-ink);border:0}
.shelf{margin-top:34px}
.shelf h2{font-size:22px;margin-bottom:12px}
.shelf-row{display:flex;gap:14px;overflow:auto;padding-bottom:8px}
.scard{position:relative;flex:none;width:170px;aspect-ratio:9/16;border-radius:16px;overflow:hidden;background:var(--surface2)}
.scard canvas,.scard img{width:100%;height:100%;object-fit:cover;display:block}
.scard span{position:absolute;left:10px;right:10px;bottom:10px;color:#fff;font-weight:600;font-size:14px;line-height:1.25;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.scard::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,8,30,.7),transparent 55%)}
.scard span{z-index:1}
.pagehead{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.pagehead h1{font-size:28px;font-weight:800}
.pagehead .btn{margin-left:auto}
.own-del{position:relative}
.own-del .icon{position:absolute;right:6px;top:6px;background:rgba(12,10,32,.7);color:#fff;z-index:2}

/* empty */
.empty{max-width:420px;margin:56px auto;text-align:center}
.empty h2{font-size:22px;margin-bottom:6px}
.empty p{color:var(--muted);margin-bottom:16px}

/* watch */
.watch{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:26px;max-width:1400px}
.player{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:16/9}
.player canvas{width:100%;height:100%;display:block}
.pctl{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:10px 14px;background:linear-gradient(to top,rgba(10,8,30,.85),transparent);color:#fff}
.pctl input[type=range]{flex:1;accent-color:var(--sun)}
.pctl .tm{font-size:13px;font-variant-numeric:tabular-nums}
.pv{width:100%;aspect-ratio:16/9;background:#000;border-radius:18px;display:block}
.watch h1{font-size:24px;margin:16px 0 10px}
.wrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.wrow .grow{flex:1;min-width:160px}
.wrow b{display:block;line-height:1.2}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:999px;background:var(--surface2);font-weight:500}
.act:hover{filter:brightness(.96)}
.act.on{background:var(--accent);color:var(--accent-ink)}
.desc{margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--surface2);white-space:pre-wrap}
.desc .vs{margin-bottom:6px;font-weight:600;color:var(--ink)}
.cm-wrap{margin-top:22px}
.cm-wrap h3{font-size:18px;margin-bottom:12px}
.cform{display:flex;gap:10px;margin-bottom:14px}
.cform input{flex:1;min-width:0;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 14px}
.cm{display:flex;gap:12px;margin:12px 0}
.cm p{margin-top:2px}
.upnext{display:flex;flex-direction:column;gap:14px}
.upnext .row{display:flex;gap:10px}
.upnext .thumb{width:160px;flex:none}
.upnext .vt{font-size:14px}

/* shorts */
.shorts-feed{height:calc(100dvh - var(--top) - var(--tab));overflow-y:auto;scroll-snap-type:y mandatory;display:flex;flex-direction:column;align-items:center;scrollbar-width:none}
.short{position:relative;flex:0 0 calc(100% - 20px);width:min(420px,100%);margin:10px 0;border-radius:20px;overflow:hidden;background:#000;scroll-snap-align:center;scroll-snap-stop:always}
.smedia{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;cursor:pointer}
.sshade{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,8,30,.78),transparent 45%);pointer-events:none}
.sinfo{position:absolute;left:16px;right:78px;bottom:16px;color:#fff;pointer-events:none}
.sinfo a,.sinfo button{pointer-events:auto}
.sinfo .who{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-weight:600}
.sinfo p{font-weight:600;line-height:1.3}
.sact{position:absolute;right:10px;bottom:16px;display:flex;flex-direction:column;gap:14px;align-items:center}
.sact .act{flex-direction:column;height:auto;width:52px;padding:10px 0;border-radius:16px;background:rgba(12,10,32,.55);color:#fff;font-size:12px;gap:4px}
.sact .act.on{background:var(--sun);color:var(--sun-ink)}
.sact svg.i{width:22px;height:22px}
.sp-badge{position:absolute;top:14px;left:14px;background:var(--sun);color:var(--sun-ink);border-radius:8px;padding:3px 10px;font-size:12px;font-weight:600}
.paused-note{position:absolute;inset:0;display:none;place-items:center;pointer-events:none;color:#fff}
.short.is-paused .paused-note{display:grid}
.paused-note svg{width:64px;height:64px;filter:drop-shadow(0 2px 10px rgba(0,0,0,.5))}

/* posts */
.col{max-width:680px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px}
.composer{padding:16px;margin-bottom:20px;display:flex;flex-direction:column;gap:12px}
.composer .c-row{display:flex;gap:12px;align-items:center}
.composer input.ptitle{flex:1;min-width:0;height:40px;border:0;border-bottom:1px solid var(--line);background:none;outline:0;font:700 17px var(--display)}
.composer textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:12px;resize:vertical;min-height:88px}
.composer textarea:focus,.composer input.ptitle:focus{border-color:var(--accent);outline:0}
.c-foot{display:flex;align-items:center;gap:12px}
.c-foot .count{margin-left:auto;font-size:13px}
.c-preview{position:relative}
.c-preview img{max-height:220px;border-radius:12px;display:block}
.post{padding:18px;margin-bottom:16px}
.post header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.post .pch{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.post .pch small{display:block;color:var(--muted);font-size:13px}
.post h3{font-size:20px;margin-bottom:6px}
.post .pt{white-space:pre-wrap}
.post img.pimg-v{width:100%;max-height:420px;object-fit:cover;border-radius:14px;margin-top:12px;display:block}
.post footer{display:flex;gap:8px;margin-top:14px}
.post .cmts{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}

/* channels + channel page */
.avrow{display:flex;gap:22px;overflow:auto;padding:4px 2px 10px}
.avrow a{display:flex;flex-direction:column;align-items:center;gap:8px;width:88px;flex:none;text-align:center;font-size:13.5px;font-weight:500}
.avrow .av{width:72px;height:72px;font-size:28px}
.chrow{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.chrow .av{width:56px;height:56px;font-size:22px}
.chrow .grow{flex:1;min-width:0}
.chrow b{display:block}
.banner{height:150px;border-radius:20px;overflow:hidden;background:var(--surface2)}
.banner canvas{width:100%;height:100%;display:block;object-fit:cover}
.chead{display:flex;gap:18px;align-items:flex-end;margin:-38px 20px 0;flex-wrap:wrap;position:relative}
.chead .info{flex:1;min-width:220px;padding-bottom:4px}
.chead h1{font-size:28px;font-weight:800}
.chead .stats{display:flex;gap:14px;color:var(--muted);font-size:14px;flex-wrap:wrap}
.chead .acts{padding-bottom:8px}
.chdesc{margin:12px 20px 0;color:var(--muted);max-width:70ch}
.tabs{display:flex;gap:6px;margin:22px 0 18px;border-bottom:1px solid var(--line)}
.tabs a{padding:10px 18px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--ink);border-color:var(--accent)}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.libgrid a{display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.libgrid a:hover{border-color:var(--accent)}
.libgrid b{font:700 32px var(--display)}

/* create channel */
.create{max-width:520px;margin:20px auto;padding:28px}
.create h1{font-size:30px;font-weight:800;margin-bottom:6px}
.create>p{color:var(--muted);margin-bottom:20px}
label.f{display:block;margin-bottom:16px;font-weight:600;font-size:14px}
label.f input,label.f textarea,label.f select{display:block;width:100%;margin-top:6px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;font-weight:400;font-size:15px}
label.f input:focus,label.f textarea:focus,label.f select:focus{outline:0;border-color:var(--accent)}
.handle{display:flex;align-items:center;margin-top:6px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding-left:12px}
.handle:focus-within{border-color:var(--accent)}
.handle input{border:0!important;margin:0!important;background:none!important}
.hint{display:block;margin-top:6px;font-weight:400;color:var(--muted)}
.hint.ok{color:#0F8A5F} .hint.bad{color:var(--danger)}

/* layer */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(12,10,32,.55);display:grid;place-items:center;padding:16px}
.scrim.clear{background:transparent;display:block}
.modal{width:min(520px,100%);max-height:92dvh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px}
.modal>header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal h2{font-size:22px}
.mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
.drop{display:block;border:2px dashed var(--line);border-radius:16px;padding:26px 16px;text-align:center;margin-bottom:16px;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--surface2)}
.drop .dt{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted)}
.drop .dt svg.i{width:30px;height:30px;color:var(--accent)}
.drop .dt b{color:var(--ink);word-break:break-all}
.choose{display:grid;gap:10px}
.choose button{display:flex;gap:14px;align-items:center;text-align:left;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--bg)}
.choose button:hover{border-color:var(--accent)}
.choose b{display:block}
.panel{position:fixed;top:calc(var(--top) + 4px);right:14px;width:340px;max-height:calc(100dvh - var(--top) - 16px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px}
.panel .ph{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.panel .ph .av{width:64px;height:64px;font-size:26px;border:0}
.panel h2{font-size:22px}
.panel .bio{margin-bottom:12px}
.pstats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.pstats div{background:var(--surface2);border-radius:12px;padding:10px 12px}
.pstats dt{font-size:12.5px;color:var(--muted)}
.pstats dd{font:700 20px var(--display)}
.plinks{display:flex;flex-direction:column;margin:12px 0}
.plinks a{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:10px;font-weight:500}
.plinks a:hover{background:var(--surface2)}
.pfoot{display:flex;gap:8px;flex-wrap:wrap}
#toasts{position:fixed;left:50%;bottom:calc(var(--tab) + 20px);transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:500;animation:tin .18s ease-out}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* friendly profile */
.panel.pp{padding:0;overflow:auto}
.pp-top{padding:20px 20px 54px;background:linear-gradient(135deg,hsl(var(--h) 78% 52%),hsl(calc(var(--h) + 55) 85% 62%));color:#fff;position:relative}
.pp-top .pp-hi{font:800 26px var(--display)}
.pp-top .pp-sub{opacity:.92;font-size:14px;margin-top:2px;padding-right:34px}
.pp-x{position:absolute;right:10px;top:10px;color:#fff}
.pp-x:hover{background:rgba(255,255,255,.22)!important}
.pp-id{display:flex;gap:14px;align-items:flex-end;padding:0 20px;margin-top:-40px}
.pp-id .av{width:80px;height:80px;font-size:36px;border:4px solid var(--surface)}
.pp-id h2{font-size:21px}
.pp-id .muted{font-size:14px;padding-bottom:2px}
.pp-body{padding:14px 20px 20px}
.pp-bio{margin-bottom:6px}
.pp-since{font-size:13px;color:var(--muted)}
.pp-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.pp-tile{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:var(--surface2)}
.pp-tile:hover{outline:2px solid var(--accent)}
.pp-tile .ti{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--sun);color:var(--sun-ink);flex:none}
.pp-tile b{display:block;font:700 20px/1 var(--display)}
.pp-tile .l{font-size:12.5px;color:var(--muted)}
.pp-check{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.pp-check h3{font-size:16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.pp-check h3 small{font:500 13px var(--body);color:var(--muted)}
.pp-bar{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden;margin-bottom:8px}
.pp-bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.pp-check ul{padding:0}
.pp-check li{list-style:none}
.pp-check li a,.pp-check li span.it{display:flex;gap:10px;align-items:center;padding:6px 4px;border-radius:8px;font-size:14px}
.pp-check li a:hover{background:var(--surface2)}
.pp-check .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.pp-check .ck svg{width:12px;height:12px;stroke-width:3;display:none}
.pp-check li.done span.it{color:var(--muted)}

  return {facebook:'https://facebook.com/',instagram:'https://instagram.com/',twitter:'https://twitter.com/'}[k]+v;
}

/* ---------- generative art (the visual identity) ---------- */
function paint(c,t){
  const ctx=c.getContext('2d'),w=c.width,h=c.height,hue=+c.dataset.h||0,st=+c.dataset.s||0,tt=t+(+c.dataset.o||0);
  const u=Math.min(w,h);
  const g=ctx.createLinearGradient(0,0,w,h);
  g.addColorStop(0,`hsl(${hue} 65% 16%)`);g.addColorStop(1,`hsl(${(hue+55)%360} 80% 40%)`);
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  if(st===0){
    for(let i=0;i<7;i++){
      ctx.beginPath();ctx.moveTo(0,h);
      for(let x=0;x<=w;x+=6){ctx.lineTo(x,h*(.28+i*.1)+Math.sin(x/w*(5+i*.4)+tt*(.5+i*.13)+i)*h*.06)}
      ctx.lineTo(w,h);ctx.closePath();
      ctx.fillStyle=`hsla(${(hue+i*24)%360} 92% ${52+i*4}% / .36)`;ctx.fill();
    }
  }else if(st===1){
    const cx=w/2,cy=h/2;
    for(let i=1;i<=8;i++){
      const r=u*.055*i+u*.02;
      ctx.strokeStyle=`hsla(${(hue+i*18)%360} 100% 78% / .45)`;ctx.lineWidth=Math.max(1.5,u/160);
      ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.stroke();
      const a=tt*(1.1/Math.sqrt(i))+i*1.3;
      ctx.fillStyle=`hsl(${(hue+i*30)%360} 100% 72%)`;
      ctx.beginPath();ctx.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r,u*(.008+i*.004),0,7);ctx.fill();
    }
  }else if(st===2){
    const n=10,s=Math.max(w,h)/n;
    for(let i=-1;i*s<w+s;i++)for(let j=-1;j*s<h+s;j++){
      const d=Math.hypot(i-w/s/2,j-h/s/2),k=(Math.sin(d*.85-tt*1.5)+1)/2,q=s*(.25+k*.6);
      ctx.fillStyle=`hsla(${(hue+(i+j)*7+360)%360} 95% ${58+k*16}% / .82)`;
      ctx.fillRect(i*s+(s-q)/2,j*s+(s-q)/2,q,q);
    }
  }else{
    for(let i=0;i<6;i++){
      const x=w*(.5+.36*Math.sin(tt*.42+i*1.7)),y=h*(.5+.36*Math.cos(tt*.37+i*2.3)),r=u*(.42+.07*i);
      const rg=ctx.createRadialGradient(x,y,0,x,y,r);
      rg.addColorStop(0,`hsla(${(hue+i*36)%360} 96% 64% / .8)`);rg.addColorStop(1,`hsla(${(hue+i*36)%360} 96% 64% / 0)`);
      ctx.fillStyle=rg;ctx.fillRect(0,0,w,h);
    }
  }
}

/* ---------- player ---------- */
function setupPlayer(id){
  const it=getItem(id),c=$('#pc');if(!it||!c)return;
  P={c,it,t:0,rate:1,nextId:c.dataset.next||'',ended:false,playing:!reduce,dirty:true,seek:$('#seek'),tm:$('#tm'),b:$('#ppb')};
  setPB();
}
function setPB(){if(P&&P.b)P.b.innerHTML=P.playing?I.pause:I.play}
let last=performance.now();
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(P&&P.c.isConnected){
    if(P.playing){P.t+=dt*P.rate;P.dirty=true;if(P.t>=P.it.dur){P.t=P.it.dur;P.playing=false;setPB();if(S.autoplay&&P.nextId&&!P.ended){P.ended=true;const nid=P.nextId;setTimeout(()=>{if(P&&P.nextId===nid)go('/watch/'+nid)},900)}}P.seek.value=P.t;P.tm.textContent=mmss(P.t)+' / '+mmss(P.it.dur)}
    if(P.dirty){paint(P.c,P.t);P.dirty=false}
  }
  if(!reduce)$$('canvas[data-anim]').forEach(c=>{const r=c.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight+60)return;c._t=(c._t||0)+dt;paint(c,c._t)});
  requestAnimationFrame(frame);
}

/* ---------- shorts ---------- */
let io=null;
function setupShorts(){
  const feed=$('#feed');if(!feed)return;
  if(io)io.disconnect();
  const secs=$$('.short',feed);
  io=new IntersectionObserver(es=>es.forEach(e=>{
    const s=e.target,m=$('.smedia',s);
    if(e.isIntersecting&&e.intersectionRatio>=.6){
      s.classList.remove('is-paused');
      if(m.tagName==='VIDEO'){m.play().catch(()=>{})}else if(m.tagName==='CANVAS'&&!reduce){m.setAttribute('data-anim','')}
      addHistory(s.dataset.id,true);
    }else{
      if(m.tagName==='VIDEO')m.pause();else if(m.tagName==='CANVAS')m.removeAttribute('data-anim');
    }
  }),{root:feed,threshold:[0,.6,1]});
  secs.forEach(s=>io.observe(s));
  const start=feed.dataset.start&&$(`.short[data-id="${feed.dataset.start}"]`,feed);
  if(start){feed.scrollTop=start.offsetTop-((feed.clientHeight-start.offsetHeight)/2)}
}

   <label class="drop" id="drop"><input type="file" id="ufile" accept="video/*" hidden><span class="dt">${I.upload}<b>Choose a video file</b><small>${kind==='short'?'Vertical clips up to 60 seconds work best':'MP4, WebM or MOV'}. You can also drop it here.</small></span></label>
   <label class="f">Title<input name="title" required maxlength="100" autocomplete="off"></label>
   <label class="f">Description<textarea name="desc" rows="3" maxlength="500"></textarea></label>
   ${kind==='video'?`<label class="f">Category<select name="cat">${CATS.slice(1).map(c=>`<option>${c}</option>`).join('')}</select></label>`:''}
   <div class="mfoot"><button type="button" class="btn ghost" data-a="closeLayer">Cancel</button><button class="btn primary" id="pubBtn" type="submit" disabled>Publish</button></div></form>`));
}
function setFile(f){
  if(!f)return;
  if(!/^video\//.test(f.type)&&!/\.(mp4|webm|mov|m4v|ogv)$/i.test(f.name)){toast('Choose a video file (MP4, WebM or MOV).');return}
  pendingFile=f;
  $('#drop .dt').innerHTML=`${I.film}<b>${esc(f.name)}</b><small>${(f.size/1048576).toFixed(1)} MB. Choose another file to replace it.</small>`;
  const t=$('input[name=title]',$('#layer'));if(t&&!t.value)t.value=f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ');
  $('#pubBtn').disabled=false;
}
function probe(url){
  return new Promise(res=>{
    const v=document.createElement('video');v.muted=true;v.preload='metadata';v.playsInline=true;
    let done=false;const fin=o=>{if(!done){done=true;res(o)}};
    const d=()=>isFinite(v.duration)?v.duration:0;
    setTimeout(()=>fin({dur:d(),thumb:''}),5000);
    v.onloadedmetadata=()=>{try{v.currentTime=Math.min(1,(d()||2)/2)}catch(e){fin({dur:d(),thumb:''})}};
    v.onseeked=()=>{try{const c=document.createElement('canvas');c.width=480;c.height=270;const x=c.getContext('2d');const r=Math.max(480/v.videoWidth,270/v.videoHeight),w=v.videoWidth*r,h=v.videoHeight*r;x.drawImage(v,(480-w)/2,(270-h)/2,w,h);fin({dur:d(),thumb:c.toDataURL('image/jpeg',.72)})}catch(e){fin({dur:d(),thumb:''})}};
    v.onerror=()=>fin({dur:0,thumb:''});
    v.src=url;
  });
}
async function publish(form){
  const f=pendingFile;if(!f)return;
  const kind=form.dataset.kind,btn=$('#pubBtn');btn.disabled=true;btn.textContent='Publishing';
  const fd=new FormData(form);
  const id='u'+Date.now().toString(36);
  const url=URL.createObjectURL(f);
  const meta=await probe(url);
  const kept=await idb.put(id,f);
  const it={id,type:kind,ch:'me',title:String(fd.get('title')).trim(),desc:String(fd.get('desc')||'').trim(),cat:kind==='short'?'Shorts':(fd.get('cat')||'Ideas'),dur:meta.dur||0,views:0,likes:0,cm:0,ts:Date.now(),h:hash(id)%360,s:hash(id)%4,thumb:meta.thumb,src:url,kept};
  S.uploads.unshift(it);save();closeLayer();
  toast(kept?'Published':'Published for this session only');
  go(kind==='short'?'/me/shorts':'/me/videos');
}

/* ---------- actions ---------- */
const A={
  cat(id){homeCat=id;render()},
  like(id){const i=S.liked.indexOf(id);if(i<0){S.liked.unshift(id);S.did.like=true}else S.liked.splice(i,1);save();listRoute()?render():refresh()},
  later(id){const i=S.later.indexOf(id);if(i<0){S.later.unshift(id);S.did.later=true;toast('Saved to Watch later')}else{S.later.splice(i,1);toast('Removed from Watch later')}save();listRoute()?render():refresh()},
  sub(id){const i=S.subs.indexOf(id);if(i<0){S.subs.push(id);S.did.sub=true;toast('Subscribed to '+getCh(id).name)}else{S.subs.splice(i,1);toast('Unsubscribed')}save();listRoute()?render():refresh()},
  async share(id){const it=getItem(id);const u=location.href.split('#')[0]+linkOf(it);try{await navigator.clipboard.writeText(u);toast('Link copied')}catch(e){toast('Copy the link from your address bar')}},
  tap(id,t){const s=t.closest('.short');if(t.tagName==='VIDEO'){if(t.paused){t.play();s.classList.remove('is-paused')}else{t.pause();s.classList.add('is-paused')}}else{if(t.hasAttribute('data-anim')){t.removeAttribute('data-anim');s.classList.add('is-paused')}else if(!reduce){t.setAttribute('data-anim','');s.classList.remove('is-paused')}}},
  pp(){if(!P)return;if(P.t>=P.it.dur){P.t=0;P.ended=false}P.playing=!P.playing;P.dirty=true;setPB()},
  cmt(id){const b=$('#cm-'+id);if(b.hidden){b.innerHTML=cmtBlock(id);b.hidden=false;const i=$('input',b);i&&i.focus()}else b.hidden=true},
  async post(_,t){
    const c=t.closest('[data-composer]');const body=$('.pbody',c).value.trim(),title=$('.ptitle',c).value.trim();
    if(!body){toast('Write your thought first');return}
    t.disabled=true;
    const id='u'+Date.now().toString(36);const it={id,type:'post',ch:'me',title,body,likes:0,cm:0,ts:Date.now()};
    if(c._file){const ok=await idb.put(id+'-img',c._file);it.hasImg=ok;it.img=URL.createObjectURL(c._file)}
    S.uploads.unshift(it);save();toast('Posted');render();
  },
  del(id){const it=getItem(id);if(!it)return;layer(modal('Delete this '+(it.type==='post'?'post':it.type)+'?',`<p class="muted" style="margin-bottom:16px">"${esc(it.title||it.body.slice(0,60))}" will be removed from your channel. This cannot be undone.</p><div class="mfoot"><button class="btn ghost" data-a="closeLayer">Keep it</button><button class="btn danger" data-a="delYes" data-id="${id}">Delete</button></div>`))},
  async delYes(id){S.uploads=S.uploads.filter(u=>u.id!==id);S.liked=S.liked.filter(x=>x!==id);S.later=S.later.filter(x=>x!==id);S.history=S.history.filter(h=>h.id!==id);save();await idb.del(id);await idb.del(id+'-img');closeLayer();toast('Deleted');render()},
  rmHist(id){S.history=S.history.filter(h=>h.id!==id);save();render()},
  clearHist(){S.history=[];save();render();toast('History cleared')},
  profile(){$('#layer').innerHTML?closeLayer():openProfile()},
  editProfile(){openEditProfile()},
  theme(){const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const n=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('tilt.theme',n)}catch(e){}},
  openUpload(){openChooser()},
  upload(kind){openUpload(kind)},
  writePost(){closeLayer();if(!S.channel){pending={k:'post'};go('/me');toast('Create your channel to post');return}go('/posts');setTimeout(()=>{const t=$('.pbody');t&&t.focus()},50)},
  editChannel(){openEditChannel()},
  verify(){openVerify()},
  doVerify(){if(!S.channel||!verifyChecks().every(x=>x[0]))return;S.channel.verified=true;S.channel.verifiedAt=Date.now();save();closeLayer();toast('Your channel is verified');render()},
  notifs(){$('#layer').innerHTML?closeLayer():openNotifs()},
  readN(id){if(!S.readN.includes(id))S.readN.push(id);save();closeLayer();updateBell()},
  readAll(){notifItems().forEach(i=>{if(!S.readN.includes(i.id))S.readN.push(i.id)});save();updateBell();openNotifs()},
  autoplay(_,t){S.autoplay=!S.autoplay;save();t.classList.toggle('on',S.autoplay);toast(S.autoplay?'Autoplay is on':'Autoplay is off')},
  sort(id){chSort=id;render()},
  savePost(id){const i=S.saved.indexOf(id);if(i<0){S.saved.unshift(id);toast('Post saved')}else{S.saved.splice(i,1);toast('Removed from saved')}save();listRoute()?render():refresh()},
  pickEmoji(id){editEmoji=id==='_'?'':id;updPrev()},
  pickHue(id){editHue=+id;huePicked=true;updPrev()},
  edit(id){
    const it=getItem(id);if(!it)return;const isP=it.type==='post';
    layer(modal('Edit '+(isP?'post':it.type),`<form data-form="edit" data-id="${id}"><label class="f">Title<input name="title" ${isP?'':'required'} maxlength="100" value="${esc(it.title)}"></label><label class="f">${isP?'Text':'Description'}<textarea name="text" rows="4" maxlength="${isP?800:500}" ${isP?'required':''}>${esc(isP?it.body:(it.desc||''))}</textarea></label><div class="mfoot"><button type="button" class="btn ghost" data-a="closeLayer">Cancel</button><button class="btn primary" type="submit">Save changes</button></div></form>`));
  },
  closeLayer(){closeLayer()},
  scrim(_,t,e){if(e.target===t)closeLayer()}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');
  if(t&&A[t.dataset.a]){A[t.dataset.a](t.dataset.id,t,e);return}
  const pf=e.target.closest('[data-post-first]');if(pf)pending={k:'post'};
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#layer').innerHTML)closeLayer();
  const f=$('#feed');
  if(f&&!$('#layer').innerHTML&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){
    if(e.key==='ArrowDown'||e.key==='j'){e.preventDefault();f.scrollBy({top:f.clientHeight,behavior:reduce?'auto':'smooth'})}
    if(e.key==='ArrowUp'||e.key==='k'){e.preventDefault();f.scrollBy({top:-f.clientHeight,behavior:reduce?'auto':'smooth'})}
  }
});
document.addEventListener('ended',e=>{const v=e.target;if(v.classList&&v.classList.contains('pv')&&S.autoplay&&v.dataset.next)go('/watch/'+v.dataset.next)},true);

/* forms */
const takenHandles=()=>CH.map(c=>c.handle);
function checkHandle(v){
  if(!v)return {ok:false,msg:'3 to 20 characters: lowercase letters, numbers, dot or underscore.',cls:''};
  if(!/^[a-z0-9._]+$/.test(v))return {ok:false,msg:'Use only lowercase letters, numbers, dot or underscore.',cls:'bad'};
  if(v.length<3)return {ok:false,msg:'Username needs at least 3 characters.',cls:'bad'};
  if(takenHandles().includes(v))return {ok:false,msg:'@'+v+' is taken. Try another username.',cls:'bad'};
  return {ok:true,msg:'@'+v+' is available.',cls:'ok'};
}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='handleIn'){t.value=t.value.toLowerCase().replace(/\s/g,'');const r=checkHandle(t.value);const m=$('#handleMsg');m.textContent=r.msg;m.className='hint '+r.cls}
  if(t.classList&&t.classList.contains('pbody')){const c=t.closest('[data-composer]');$('.count',c).textContent=t.value.length+'/800'}
  if(t.id==='seek'&&P){P.t=+t.value;P.dirty=true;P.tm.textContent=mmss(P.t)+' / '+mmss(P.it.dur)}
  if(t.name==='name'&&$('#epPrev'))updPrev();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='spd'){const r=+t.value;if(P)P.rate=r;const v=$('.pv');if(v)v.playbackRate=r}
  if(t.id==='ufile')setFile(t.files[0]);
  if(t.classList&&t.classList.contains('pimg')){
    const c=t.closest('[data-composer]'),f=t.files[0];if(!f)return;
    if(!/^image\//.test(f.type)){toast('Choose an image file');t.value='';return}
    c._file=f;const pv=$('.c-preview',c);pv.innerHTML=`<img src="${URL.createObjectURL(f)}" alt="Selected image">`;pv.hidden=false;
  }
});
document.addEventListener('dragover',e=>{const d=e.target.closest('.drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest('.drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest('.drop');if(d){e.preventDefault();d.classList.remove('over');setFile(e.dataTransfer.files[0])}});

document.addEventListener('submit',e=>{
  const f=e.target,k=f.dataset.form;
  if(f.id==='searchForm'){e.preventDefault();const q=$('#q').value.trim();if(q)go('/search/'+encodeURIComponent(q));return}
  if(!k)return;e.preventDefault();
  const fd=new FormData(f);
  if(k==='channel'){
    const name=String(fd.get('name')).trim(),handle=String(fd.get('handle')).trim().toLowerCase();
    if(!name){toast('Add a channel name');return}
    const r=checkHandle(handle);if(!r.ok){const m=$('#handleMsg');m.textContent=r.msg;m.className='hint bad';$('#handleIn').focus();return}
    const links=readLinks(fd);if(!links)return;
    S.channel={name,handle,desc:String(fd.get('desc')).trim(),links,hue:hash(handle)%360,created:Date.now()};S.user.country=String(fd.get('country')||'');
    if(S.user.name==='Guest')S.user.name=name;
    save();toast('Channel created');
    const p=pending;pending=null;
    go('/me');render();
    if(p&&p.k==='upload')setTimeout(()=>openUpload(p.kind),120);
    if(p&&p.k==='post')go('/posts');
  }
  if(k==='profile'){S.user.name=String(fd.get('name')).trim()||'Guest';S.user.bio=String(fd.get('bio')).trim();S.user.country=String(fd.get('country')||'');S.user.emoji=editEmoji;if(huePicked){S.user.hue=editHue;S.user.hueSet=true}save();closeLayer();updateHeader();toast('Profile saved');if(/^\/(me|c|posts|saved)/.test(cp))render()}
  if(k==='edit'){const it=getItem(f.dataset.id);if(it){const t=String(fd.get('title')||'').trim(),x=String(fd.get('text')||'').trim();it.title=t;if(it.type==='post'){if(!x){toast('Text cannot be empty');return}it.body=x}else it.desc=x;save();closeLayer();toast('Changes saved');render()}}
  if(k==='upload')publish(f);
  if(k==='editchannel'){
    const name=String(fd.get('name')).trim();if(!name){toast('Add a channel name');return}
    const links=readLinks(fd);if(!links)return;
    S.channel.name=name;S.channel.desc=String(fd.get('desc')||'').trim();S.channel.links=links;S.user.country=String(fd.get('country')||'');
    save();closeLayer();updateHeader();toast('Channel updated');render();
  }
  if(k==='comment'){
    const id=f.dataset.id,t=String(fd.get('t')).trim();if(!t)return;
    (S.comments[id]=S.comments[id]||[]).unshift({n:S.user.name,t,ts:Date.now()});save();
    $('#cm-'+id).innerHTML=cmtBlock(id);const i=$('#cm-'+id+' input');i&&i.focus();
    const it=getItem(id);$$('.cmn[data-id="'+id+'"]').forEach(n=>n.textContent=cmCount(it));
  }
});
$('#mobSearch').addEventListener('click',()=>{const s=$('#searchForm');s.classList.toggle('show');if(s.classList.contains('show')){s.style.cssText='display:flex;position:absolute;left:12px;right:12px;top:8px;z-index:25;height:44px;max-width:none';$('#q').focus()}else s.style.cssText=''});
matchMedia('(max-width:899px)').addEventListener('change',()=>{});
const mq=matchMedia('(max-width:899px)');const fixMob=()=>{$('#mobSearch').style.display=mq.matches?'grid':'none'};mq.addEventListener('change',fixMob);fixMob();

/* hover animation on card thumbnails */
document.addEventListener('mouseover',e=>{const c=e.target.closest('.thumb canvas[data-static]');if(c&&!reduce)c.setAttribute('data-anim','')});
document.addEventListener('mouseout',e=>{const c=e.target.closest('.thumb canvas[data-static]');if(c){c.removeAttribute('data-anim');paint(c,0)}});

/* ---------- boot ---------- */
(async function init(){
  try{const th=localStorage.getItem('tilt.theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
  load();
  buildNav();
  await idb.open();
  for(const u of S.uploads){
    try{
      if(u.type==='post'){if(u.hasImg){const b=await idb.get(u.id+'-img');if(b)u.img=URL.createObjectURL(b)}}
      else{const b=await idb.get(u.id);if(b)u.src=URL.createObjectURL(b);else u.missing=true}
    }catch(e){}
  }
  readPath();render();
  requestAnimationFrame(frame);
})();
})();
</script>
