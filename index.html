<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Person Chat Room</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 80vh;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Setup Screen */
        #setup-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1;
            padding: 30px;
            text-align: center;
        }

        #setup-screen h2 {
            margin-bottom: 20px;
            color: #333;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #0084ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #0066cc;
        }

        /* Chat Screen */
        #chat-screen {
            display: none;
            flex-direction: column;
            flex: 1;
        }

        .chat-header {
            background: #0084ff;
            color: white;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .leave-btn {
            background: transparent;
            border: 1px solid white;
            padding: 5px 10px;
            font-size: 12px;
            width: auto;
            border-radius: 4px;
        }

        .leave-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .messages-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #e5ddd5;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            position: relative;
            word-wrap: break-word;
        }

        .msg .sender {
            font-size: 11px;
            font-weight: bold;
            display: block;
            margin-bottom: 3px;
            color: #555;
        }

        /* Styling for current user vs other users */
        .msg.me {
            background-color: #d9fdd3;
            align-self: flex-end;
        }
        .msg.me .sender {
            color: #2b7a2b;
        }

        .msg.others {
            background-color: #fff;
            align-self: flex-start;
        }

        .input-area {
            display: flex;
            padding: 10px;
            background: #f0f0f0;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            margin-bottom: 0;
        }

        .input-area button {
            width: auto;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- SCREEN 1: Choose Username -->
        <div id="setup-screen">
            <h2>Join Chat Room</h2>
            <input type="text" id="username-input" placeholder="Enter your name..." autocomplete="off">
            <button id="join-btn">Join Chat</button>
        </div>

        <!-- SCREEN 2: The Chat Interface -->
        <div id="chat-screen">
            <div class="chat-header">
                <span id="room-title">Chat Room</span>
                <button class="leave-btn" id="leave-btn">Leave</button>
            </div>
            <div class="messages-box" id="messages-box">
                <!-- Messages will appear here dynamically -->
            </div>
            <div class="input-area">
                <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off">
                <button id="send-btn">Send</button>
            </div>
        </div>
    </div>

    <script>
        const setupScreen = document.getElementById('setup-screen');
        const chatScreen = document.getElementById('chat-screen');
        const usernameInput = document.getElementById('username-input');
        const joinBtn = document.getElementById('join-btn');
        const leaveBtn = document.getElementById('leave-btn');
        const messagesBox = document.getElementById('messages-box');
        const msgInput = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');

        let currentUser = "";

        // 1. Join Chat Logic
        joinBtn.addEventListener('click', () => {
            const name = usernameInput.value.trim();
            if (name) {
                currentUser = name;
                setupScreen.style.display = 'none';
                chatScreen.style.display = 'flex';
                loadMessages();
            }
        });

        // 2. Send Message Logic
        function sendMessage() {
            const text = msgInput.value.trim();
            if (!text) return;

            // Grab existing messages or start a new array
            const chatHistory = JSON.parse(localStorage.getItem('multi_chat_history')) || [];
            
            // Create a new message object
            const newMsg = {
                sender: currentUser,
                text: text,
                timestamp: Date.now()
            };

            chatHistory.push(newMsg);
            localStorage.setItem('multi_chat_history', JSON.stringify(chatHistory));

            msgInput.value = "";
            loadMessages();

            // Trigger an update event manually for the local tab
            window.dispatchEvent(new Event('storage'));
        }

        sendBtn.addEventListener('click', sendMessage);
        msgInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // 3. Load and Display Messages
        function loadMessages() {
            const chatHistory = JSON.parse(localStorage.getItem('multi_chat_history')) || [];
            messagesBox.innerHTML = ''; // Clear previous UI content

            chatHistory.forEach(msg => {
                const msgDiv = document.createElement('div');
                // Check if message belongs to the current user or someone else
                const isMe = msg.sender === currentUser;
                
                msgDiv.className = `msg ${isMe ? 'me' : 'others'}`;
                msgDiv.innerHTML = `<span class="sender">${msg.sender}</span>${msg.text}`;
                
                messagesBox.appendChild(msgDiv);
            });

            // Scroll to the bottom of the chat box
            messagesBox.scrollTop = messagesBox.scrollHeight;
        }

        // 4. Live Sync Across Tabs/Windows
        // This listens to any changes happening in localStorage on another tab
        window.addEventListener('storage', () => {
            if (chatScreen.style.display === 'flex') {
                loadMessages();
            }
        });

        // 5. Leave Chat Logic
        leaveBtn.addEventListener('click', () => {
            currentUser = "";
            chatScreen.style.display = 'none';
            setupScreen.style.display = 'flex';
            usernameInput.value = "";
        });
    </script>
</body>
</html>
